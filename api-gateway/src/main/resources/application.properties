spring.cloud.gateway.server.webflux.routes[3].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.name=post-service
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.fallbackUri=forward:/fallback/postService

