server.port=8080
spring.application.name=api-gateway

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Enable discovery routing
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# ==================================================
# AUTH SERVICE
# Controller: @RequestMapping("/auth")
# ==================================================

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**


# ==================================================
# USER SERVICE
# Controller: @RequestMapping("/api/users")
# ==================================================

spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**


# ==================================================
# POST FEED SERVICE
# Controllers:
# /posts
# /feed
# ==================================================

spring.cloud.gateway.server.webflux.routes[2].id=post-service-posts
spring.cloud.gateway.server.webflux.routes[2].uri=lb://POST-FEED-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/posts/**

spring.cloud.gateway.server.webflux.routes[3].id=post-service-feed
spring.cloud.gateway.server.webflux.routes[3].uri=lb://POST-FEED-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/feed/**


# ==================================================
# CONNECTION SERVICE
# Controller: /connections
# ==================================================

spring.cloud.gateway.server.webflux.routes[4].id=connection-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://CONNECTION-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/connections/**


# ==================================================
# INTERACTION + NOTIFICATION SERVICE
# Controllers:
# /api/interactions
# /api/comments
# /api/shares
# /api/notifications
# /api/analytics
# ==================================================

spring.cloud.gateway.server.webflux.routes[5].id=interaction-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://INTERACTION-NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/interactions/**

spring.cloud.gateway.server.webflux.routes[6].id=comment-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://INTERACTION-NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/comments/**

spring.cloud.gateway.server.webflux.routes[7].id=share-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://INTERACTION-NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/shares/**

spring.cloud.gateway.server.webflux.routes[8].id=notification-service
spring.cloud.gateway.server.webflux.routes[8].uri=lb://INTERACTION-NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/notifications/**

spring.cloud.gateway.server.webflux.routes[9].id=analytics-service
spring.cloud.gateway.server.webflux.routes[9].uri=lb://INTERACTION-NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/api/analytics/**