<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-icon"><i class="fas fa-lock-open"></i></div>
            <h2>Reset Password</h2>
            <p class="subtitle">Securely recover your RevConnect account</p>
        </div>

        <div *ngIf="error()" class="error-msg"><i class="fas fa-exclamation-circle"></i> {{ error() }}</div>
        <div *ngIf="success()" class="success-msg"><i class="fas fa-check-circle"></i> {{ success() }}</div>

        <!-- Step 1: Email -->
        <form *ngIf="step() === 1" (ngSubmit)="getQuestion()">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input class="form-input" type="email" placeholder="enter your registered email" [(ngModel)]="email"
                    name="email" required>
            </div>
            <button class="btn btn-primary w-full" type="submit" [disabled]="loading()">
                <span *ngIf="!loading()">Next Step <i class="fas fa-arrow-right"></i></span>
                <span *ngIf="loading()"><i class="fas fa-spinner fa-spin"></i> Checking...</span>
            </button>
        </form>

        <!-- Step 2: Answer & New Password -->
        <div *ngIf="step() === 2">
            <div class="question-info">
                <span class="q-label">Security Question:</span>
                <p class="q-text">{{ securityQuestion() }}</p>
            </div>
            <form (ngSubmit)="resetPassword()">
                <div class="form-group">
                    <label class="form-label">Your Answer</label>
                    <input class="form-input" type="text" placeholder="enter your answer" [(ngModel)]="answer"
                        name="answer" required>
                </div>
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <input class="form-input" type="password" placeholder="min. 6 characters" [(ngModel)]="newPassword"
                        name="newPassword" required>
                </div>
                <button class="btn btn-primary w-full" type="submit" [disabled]="loading()">
                    <span *ngIf="!loading()"><i class="fas fa-key"></i> Reset Password</span>
                    <span *ngIf="loading()"><i class="fas fa-spinner fa-spin"></i> Resetting...</span>
                </button>
                <button class="btn btn-ghost w-full" type="button" (click)="step.set(1)" style="margin-top:12px">
                    Back to Step 1
                </button>
            </form>
        </div>

        <div class="divider"><span>Or</span></div>
        <p class="text-center"><a routerLink="/auth/login">Back to Sign In</a></p>
    </div>
</div>
